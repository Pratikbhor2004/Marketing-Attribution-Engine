[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-attribution-engine"
version = "2.0.0"
description = "Reproducible synthetic marketing attribution and campaign ROI analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "streamlit>=1.46",
  "plotly>=5.19",
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
attribution-engine = "attribution_engine.cli:main"

[tool.setuptools.packages.find]
include = ["attribution_engine*"]

[tool.setuptools.package-data]
attribution_engine = ["openapi_examples.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]
